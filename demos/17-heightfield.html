<!DOCTYPE html>
<html>
<head>
    <title>Height Field Simulation</title>
    <style>
        body { margin: 0; background: #000; }
        canvas { display: block; }
        .info { position: absolute; top: 10px; left: 10px; color: #fff; font: 12px monospace; background: rgba(0,0,0,0.7); padding: 10px; }
    </style>
</head>
<body>
    <div class="info">
        <b>Height Field Simulation</b><br>
        2D wave equation simulation.<br>
        Click to create disturbances!<br>
        Physically accurate propagation.
    </div>
    <canvas id="c"></canvas>
    <script>
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl');

const SIZE = 256;

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    gl.viewport(0, 0, canvas.width, canvas.height);
}
resize();
window.addEventListener('resize', resize);

// Two height buffers for ping-pong
let heights = [
    new Float32Array(SIZE * SIZE),
    new Float32Array(SIZE * SIZE)
];
let velocities = new Float32Array(SIZE * SIZE);
let current = 0;

// Initialize with some waves
for (let y = 0; y < SIZE; y++) {
    for (let x = 0; x < SIZE; x++) {
        const dx = x - SIZE / 2;
        const dy = y - SIZE / 2;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < 20) {
            heights[0][y * SIZE + x] = Math.cos(dist * 0.2) * 0.5;
        }
    }
}

// Wave equation simulation step
function simulate() {
    const c = 0.5; // wave speed
    const damping = 0.998;

    const curr = heights[current];
    const next = heights[1 - current];

    for (let y = 1; y < SIZE - 1; y++) {
        for (let x = 1; x < SIZE - 1; x++) {
            const i = y * SIZE + x;

            // Laplacian (neighbors average - center)
            const laplacian = (
                curr[i - 1] + curr[i + 1] +
                curr[i - SIZE] + curr[i + SIZE]
            ) / 4 - curr[i];

            // Wave equation: acceleration = c^2 * laplacian
            velocities[i] += c * c * laplacian;
            velocities[i] *= damping;

            // Update height
            next[i] = curr[i] + velocities[i];
        }
    }

    current = 1 - current;
}

// Add disturbance
function addSplash(nx, ny, radius = 10, strength = 1) {
    const x = Math.floor(nx * SIZE);
    const y = Math.floor(ny * SIZE);

    for (let dy = -radius; dy <= radius; dy++) {
        for (let dx = -radius; dx <= radius; dx++) {
            const px = x + dx;
            const py = y + dy;
            if (px >= 0 && px < SIZE && py >= 0 && py < SIZE) {
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < radius) {
                    const i = py * SIZE + px;
                    heights[current][i] += Math.cos(dist / radius * Math.PI / 2) * strength;
                }
            }
        }
    }
}

canvas.addEventListener('click', (e) => {
    const rect = canvas.getBoundingClientRect();
    const nx = e.clientX / rect.width;
    const ny = e.clientY / rect.height;
    addSplash(nx, ny, 15, 2);
});

// Render shader
const vs = `attribute vec2 pos; void main() { gl_Position = vec4(pos, 0, 1); }`;

const fs = `
precision highp float;
uniform vec2 resolution;
uniform sampler2D heightMap;

void main() {
    vec2 uv = gl_FragCoord.xy / resolution;

    float h = texture2D(heightMap, uv).r;

    // Calculate normals from height differences
    float eps = 1.0 / 256.0;
    float hx = texture2D(heightMap, uv + vec2(eps, 0.0)).r;
    float hy = texture2D(heightMap, uv + vec2(0.0, eps)).r;

    vec3 normal = normalize(vec3(h - hx, h - hy, 0.1));

    // Lighting
    vec3 lightDir = normalize(vec3(0.5, 0.5, 1.0));
    float diff = max(dot(normal, lightDir), 0.0);

    vec3 viewDir = vec3(0.0, 0.0, 1.0);
    vec3 halfDir = normalize(lightDir + viewDir);
    float spec = pow(max(dot(normal, halfDir), 0.0), 32.0);

    // Color
    vec3 deepColor = vec3(0.0, 0.1, 0.25);
    vec3 surfaceColor = vec3(0.0, 0.35, 0.5);

    float heightFactor = h * 0.5 + 0.5;
    vec3 color = mix(deepColor, surfaceColor, heightFactor);

    color += vec3(0.15) * diff;
    color += vec3(0.8, 0.9, 1.0) * spec * 0.5;

    // Height-based coloring
    if (h > 0.3) {
        color = mix(color, vec3(0.8, 0.9, 1.0), (h - 0.3) * 0.5);
    }
    if (h < -0.3) {
        color = mix(color, vec3(0.0, 0.05, 0.1), (-h - 0.3) * 0.5);
    }

    gl_FragColor = vec4(color, 1.0);
}
`;

function createShader(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    return s;
}

const prog = gl.createProgram();
gl.attachShader(prog, createShader(gl.VERTEX_SHADER, vs));
gl.attachShader(prog, createShader(gl.FRAGMENT_SHADER, fs));
gl.linkProgram(prog);
gl.useProgram(prog);

const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,1,-1,-1,1,1,1]), gl.STATIC_DRAW);

const pos = gl.getAttribLocation(prog, 'pos');
gl.enableVertexAttribArray(pos);
gl.vertexAttribPointer(pos, 2, gl.FLOAT, false, 0, 0);

const resLoc = gl.getUniformLocation(prog, 'resolution');
const texLoc = gl.getUniformLocation(prog, 'heightMap');

// Create texture for height data
const tex = gl.createTexture();
gl.bindTexture(gl.TEXTURE_2D, tex);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

// Convert height data to texture
function updateTexture() {
    const data = new Uint8Array(SIZE * SIZE * 4);
    const h = heights[current];

    for (let i = 0; i < SIZE * SIZE; i++) {
        const v = Math.floor((h[i] * 0.5 + 0.5) * 255);
        data[i * 4] = v;
        data[i * 4 + 1] = v;
        data[i * 4 + 2] = v;
        data[i * 4 + 3] = 255;
    }

    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, SIZE, SIZE, 0, gl.RGBA, gl.UNSIGNED_BYTE, data);
}

let lastTime = 0;
let accumulator = 0;
const dt = 1 / 60;

function render(t) {
    const delta = Math.min((t - lastTime) / 1000, 0.1);
    lastTime = t;

    accumulator += delta;
    while (accumulator >= dt) {
        simulate();
        accumulator -= dt;
    }

    updateTexture();

    gl.uniform2f(resLoc, canvas.width, canvas.height);
    gl.uniform1i(texLoc, 0);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

    requestAnimationFrame(render);
}

// Periodic random splashes
setInterval(() => {
    addSplash(Math.random(), Math.random(), 8, 0.5);
}, 2000);

render(0);
    </script>
</body>
</html>
