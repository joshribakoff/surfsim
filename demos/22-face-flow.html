<!DOCTYPE html>
<html>
<head>
    <title>Face Flow Lines</title>
    <style>
        body { margin: 0; background: #000; }
        canvas { display: block; }
        .info { position: absolute; top: 10px; left: 10px; color: #fff; font: 12px monospace; background: rgba(0,0,0,0.7); padding: 10px; }
    </style>
</head>
<body>
    <div class="info">
        <b>Face Flow Lines</b><br>
        Water flowing up the wave face<br>
        as it's pulled up by the breaking lip.<br>
        The "sucking up" effect surfers ride.
    </div>
    <canvas id="c"></canvas>
    <script>
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl');

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    gl.viewport(0, 0, canvas.width, canvas.height);
}
resize();
window.addEventListener('resize', resize);

const vs = `attribute vec2 pos; void main() { gl_Position = vec4(pos, 0, 1); }`;

const fs = `
precision highp float;
uniform float time;
uniform vec2 resolution;

#define PI 3.14159265

vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
vec2 mod289(vec2 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
vec3 permute(vec3 x) { return mod289(((x*34.0)+1.0)*x); }

float snoise(vec2 v) {
    const vec4 C = vec4(0.211324865405187, 0.366025403784439, -0.577350269189626, 0.024390243902439);
    vec2 i = floor(v + dot(v, C.yy));
    vec2 x0 = v - i + dot(i, C.xx);
    vec2 i1 = (x0.x > x0.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
    vec4 x12 = x0.xyxy + C.xxzz;
    x12.xy -= i1;
    i = mod289(i);
    vec3 p = permute(permute(i.y + vec3(0.0, i1.y, 1.0)) + i.x + vec3(0.0, i1.x, 1.0));
    vec3 m = max(0.5 - vec3(dot(x0,x0), dot(x12.xy,x12.xy), dot(x12.zw,x12.zw)), 0.0);
    m = m*m; m = m*m;
    vec3 x = 2.0 * fract(p * C.www) - 1.0;
    vec3 h = abs(x) - 0.5;
    vec3 ox = floor(x + 0.5);
    vec3 a0 = x - ox;
    m *= 1.79284291400159 - 0.85373472095314 * (a0*a0 + h*h);
    vec3 g;
    g.x = a0.x * x0.x + h.x * x0.y;
    g.yz = a0.yz * x12.xz + h.yz * x12.yw;
    return 130.0 * dot(m, g);
}

// Wave face curve - steepening profile
float waveFace(float x) {
    // Sigmoid-like curve for steep face
    float face = 1.0 / (1.0 + exp(-x * 5.0));
    return face * 0.6;
}

// Flow velocity field on wave face
vec2 flowField(vec2 p, float t) {
    // Upward flow that accelerates toward lip
    float faceHeight = waveFace(p.x);
    float distToSurface = faceHeight - p.y;

    // Flow direction - upward and slightly forward
    vec2 flow = vec2(0.2, 1.0);

    // Accelerate near the lip (top of face)
    float acceleration = smoothstep(0.0, 0.5, p.y / faceHeight);
    flow *= 1.0 + acceleration * 2.0;

    // Add turbulence
    flow.x += snoise(p * 5.0 + t) * 0.2;
    flow.y += snoise(p * 5.0 + t + 100.0) * 0.1;

    return flow;
}

// Advect UV along flow field for streak effect
vec2 advectUV(vec2 uv, float t, float steps) {
    vec2 p = uv;
    float dt = 0.02;

    for (float i = 0.0; i < 10.0; i++) {
        if (i >= steps) break;
        vec2 flow = flowField(p, t);
        p -= flow * dt; // Trace backward
    }

    return p;
}

void main() {
    vec2 uv = gl_FragCoord.xy / resolution;
    float aspect = resolution.x / resolution.y;

    // Transform to wave-face coordinates
    vec2 p = uv;
    p.x = (p.x - 0.3) * 2.0;
    p.y = p.y * 1.5 - 0.2;

    float t = time;

    // Wave surface
    float surface = waveFace(p.x);
    float distToSurface = surface - p.y;

    vec3 color;

    if (distToSurface > 0.0 && p.x > -0.5 && p.x < 0.8) {
        // On the wave face
        vec3 deepColor = vec3(0.0, 0.12, 0.25);
        vec3 faceColor = vec3(0.05, 0.3, 0.45);
        vec3 glassyColor = vec3(0.15, 0.5, 0.55);

        // Depth-based color
        float depth = distToSurface * 2.0;
        color = mix(faceColor, deepColor, clamp(depth, 0.0, 1.0));

        // Glassy surface layer
        float surfaceLayer = smoothstep(0.1, 0.0, distToSurface);
        color = mix(color, glassyColor, surfaceLayer * 0.5);

        // Flow lines using advected coordinates
        vec2 flowUV = advectUV(p, t, 8.0);

        // Create streak pattern
        float streaks = 0.0;

        // Multiple frequency streaks
        streaks += sin(flowUV.x * 80.0 + flowUV.y * 20.0) * 0.5 + 0.5;
        streaks *= sin(flowUV.x * 40.0 - t * 3.0) * 0.5 + 0.5;

        // Modulate by position on face
        float facePosition = p.y / surface;
        streaks *= smoothstep(0.0, 0.3, facePosition);
        streaks *= smoothstep(1.0, 0.7, facePosition);

        // Add streaks to color
        color += vec3(0.1, 0.15, 0.12) * streaks * (1.0 - depth * 0.5);

        // Highlight streaks
        float highlight = pow(streaks, 3.0);
        color += vec3(0.2, 0.3, 0.25) * highlight * surfaceLayer;

        // Speed lines - get faster toward lip
        float speedLines = sin(p.x * 100.0 + p.y * 50.0 - t * 10.0 * (1.0 + facePosition));
        speedLines = smoothstep(0.8, 1.0, speedLines);
        speedLines *= facePosition; // More visible near lip
        color += vec3(0.15, 0.2, 0.18) * speedLines;

        // Foam at lip
        if (facePosition > 0.85) {
            float foam = snoise(p * 30.0 + t * 2.0);
            foam = smoothstep(0.3, 0.7, foam);
            color = mix(color, vec3(0.9, 0.95, 1.0), foam * (facePosition - 0.85) * 6.0);
        }

        // Light refraction through water
        float refraction = sin(p.y * 30.0 + snoise(p * 10.0) * 5.0 - t * 4.0);
        refraction = smoothstep(0.6, 1.0, refraction);
        color += vec3(0.05, 0.1, 0.08) * refraction * (1.0 - depth);

    } else if (p.y > surface && p.x > -0.5) {
        // Sky above wave
        color = mix(vec3(0.5, 0.7, 0.9), vec3(0.3, 0.5, 0.8), uv.y);

        // Sun
        vec2 sunPos = vec2(0.8, 0.7);
        float sun = smoothstep(0.1, 0.0, length(uv - sunPos));
        color += vec3(1.0, 0.95, 0.85) * sun;

    } else {
        // Deep water / trough
        color = vec3(0.0, 0.08, 0.18);

        // Trough reflection
        float reflection = snoise(p * 5.0 + t * 0.5) * 0.5 + 0.5;
        color += vec3(0.02, 0.05, 0.08) * reflection;
    }

    // Surface highlight line
    if (abs(distToSurface) < 0.02 && p.x > -0.5 && p.x < 0.8) {
        float highlight = 1.0 - abs(distToSurface) / 0.02;
        color = mix(color, vec3(0.8, 0.9, 0.95), highlight * 0.6);
    }

    gl_FragColor = vec4(color, 1.0);
}
`;

function createShader(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
        console.error(gl.getShaderInfoLog(s));
    }
    return s;
}

const prog = gl.createProgram();
gl.attachShader(prog, createShader(gl.VERTEX_SHADER, vs));
gl.attachShader(prog, createShader(gl.FRAGMENT_SHADER, fs));
gl.linkProgram(prog);
gl.useProgram(prog);

const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,1,-1,-1,1,1,1]), gl.STATIC_DRAW);

const pos = gl.getAttribLocation(prog, 'pos');
gl.enableVertexAttribArray(pos);
gl.vertexAttribPointer(pos, 2, gl.FLOAT, false, 0, 0);

const timeLoc = gl.getUniformLocation(prog, 'time');
const resLoc = gl.getUniformLocation(prog, 'resolution');

function render(t) {
    gl.uniform1f(timeLoc, t * 0.001);
    gl.uniform2f(resLoc, canvas.width, canvas.height);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    requestAnimationFrame(render);
}
render(0);
    </script>
</body>
</html>
