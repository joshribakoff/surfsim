<!DOCTYPE html>
<html>
<head>
    <title>Sine Waves</title>
    <style>
        body { margin: 0; background: #000; }
        canvas { display: block; }
        .info { position: absolute; top: 10px; left: 10px; color: #fff; font: 12px monospace; background: rgba(0,0,0,0.7); padding: 10px; }
    </style>
</head>
<body>
    <div class="info">
        <b>Sine Waves</b><br>
        Multiple sine waves with different frequencies,<br>
        amplitudes, and phases combined additively.<br><br>
        Simplest wave model - purely mathematical.
    </div>
    <canvas id="c"></canvas>
    <script>
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl');

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    gl.viewport(0, 0, canvas.width, canvas.height);
}
resize();
window.addEventListener('resize', resize);

const vs = `
attribute vec2 pos;
void main() { gl_Position = vec4(pos, 0, 1); }
`;

const fs = `
precision highp float;
uniform float time;
uniform vec2 resolution;

void main() {
    vec2 uv = gl_FragCoord.xy / resolution;

    float wave = 0.0;
    // Layer multiple sine waves
    wave += sin(uv.x * 10.0 + time * 2.0) * 0.1;
    wave += sin(uv.x * 20.0 - time * 1.5) * 0.05;
    wave += sin(uv.x * 5.0 + time * 0.8) * 0.15;
    wave += sin((uv.x + uv.y) * 15.0 + time) * 0.08;

    float surface = uv.y - 0.5 - wave;

    // Water color with depth gradient
    vec3 deepWater = vec3(0.0, 0.1, 0.3);
    vec3 shallowWater = vec3(0.0, 0.4, 0.6);
    vec3 sky = vec3(0.5, 0.7, 0.9);

    vec3 color;
    if (surface < 0.0) {
        float depth = clamp(-surface * 3.0, 0.0, 1.0);
        color = mix(shallowWater, deepWater, depth);
        // Add shimmer
        color += vec3(0.1) * sin(uv.x * 50.0 + time * 3.0) * (1.0 - depth);
    } else {
        color = sky;
    }

    // Surface highlight
    if (abs(surface) < 0.01) {
        color = vec3(0.8, 0.9, 1.0);
    }

    gl_FragColor = vec4(color, 1.0);
}
`;

function createShader(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    return s;
}

const prog = gl.createProgram();
gl.attachShader(prog, createShader(gl.VERTEX_SHADER, vs));
gl.attachShader(prog, createShader(gl.FRAGMENT_SHADER, fs));
gl.linkProgram(prog);
gl.useProgram(prog);

const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,1,-1,-1,1,1,1]), gl.STATIC_DRAW);

const pos = gl.getAttribLocation(prog, 'pos');
gl.enableVertexAttribArray(pos);
gl.vertexAttribPointer(pos, 2, gl.FLOAT, false, 0, 0);

const timeLoc = gl.getUniformLocation(prog, 'time');
const resLoc = gl.getUniformLocation(prog, 'resolution');

function render(t) {
    gl.uniform1f(timeLoc, t * 0.001);
    gl.uniform2f(resLoc, canvas.width, canvas.height);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    requestAnimationFrame(render);
}
render(0);
    </script>
</body>
</html>
