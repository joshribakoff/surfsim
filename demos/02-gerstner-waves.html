<!DOCTYPE html>
<html>
<head>
    <title>Gerstner Waves</title>
    <style>
        body { margin: 0; background: #000; }
        canvas { display: block; }
        .info { position: absolute; top: 10px; left: 10px; color: #fff; font: 12px monospace; background: rgba(0,0,0,0.7); padding: 10px; }
    </style>
</head>
<body>
    <div class="info">
        <b>Gerstner Waves</b><br>
        Physically-based wave model where particles<br>
        move in circular orbits. Creates realistic<br>
        peaked crests and flat troughs.
    </div>
    <canvas id="c"></canvas>
    <script>
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl');

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    gl.viewport(0, 0, canvas.width, canvas.height);
}
resize();
window.addEventListener('resize', resize);

const vs = `attribute vec2 pos; void main() { gl_Position = vec4(pos, 0, 1); }`;

const fs = `
precision highp float;
uniform float time;
uniform vec2 resolution;

vec2 gerstner(vec2 p, float amplitude, float wavelength, float speed, vec2 dir) {
    float k = 6.28318 / wavelength;
    float phase = k * dot(dir, p) - speed * time;
    float steepness = 0.5;
    return vec2(
        steepness * amplitude * dir.x * cos(phase),
        amplitude * sin(phase)
    );
}

void main() {
    vec2 uv = gl_FragCoord.xy / resolution;
    vec2 p = uv * 4.0;

    vec2 wave = vec2(0.0);
    wave += gerstner(p, 0.15, 1.0, 2.0, normalize(vec2(1.0, 0.3)));
    wave += gerstner(p, 0.08, 0.5, 3.0, normalize(vec2(0.8, -0.2)));
    wave += gerstner(p, 0.05, 0.3, 4.0, normalize(vec2(1.0, 0.5)));
    wave += gerstner(p, 0.12, 0.8, 1.5, normalize(vec2(0.9, 0.1)));

    float surface = uv.y - 0.5 - wave.y;

    vec3 deepWater = vec3(0.02, 0.08, 0.2);
    vec3 shallowWater = vec3(0.1, 0.4, 0.5);
    vec3 sky = vec3(0.6, 0.75, 0.9);

    vec3 color;
    if (surface < 0.0) {
        float depth = clamp(-surface * 2.5, 0.0, 1.0);
        color = mix(shallowWater, deepWater, depth);

        // Fake normals for lighting
        float dx = wave.x * 0.5;
        vec3 normal = normalize(vec3(-dx, 1.0, 0.0));
        vec3 light = normalize(vec3(0.5, 1.0, 0.3));
        float diff = max(dot(normal, light), 0.0);
        color += vec3(0.15) * diff;
    } else {
        color = sky;
    }

    // Foam at peaks
    if (surface < 0.0 && surface > -0.02) {
        float foam = smoothstep(-0.02, 0.0, surface);
        color = mix(color, vec3(0.9, 0.95, 1.0), foam * 0.7);
    }

    gl_FragColor = vec4(color, 1.0);
}
`;

function createShader(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    return s;
}

const prog = gl.createProgram();
gl.attachShader(prog, createShader(gl.VERTEX_SHADER, vs));
gl.attachShader(prog, createShader(gl.FRAGMENT_SHADER, fs));
gl.linkProgram(prog);
gl.useProgram(prog);

const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,1,-1,-1,1,1,1]), gl.STATIC_DRAW);

const pos = gl.getAttribLocation(prog, 'pos');
gl.enableVertexAttribArray(pos);
gl.vertexAttribPointer(pos, 2, gl.FLOAT, false, 0, 0);

const timeLoc = gl.getUniformLocation(prog, 'time');
const resLoc = gl.getUniformLocation(prog, 'resolution');

function render(t) {
    gl.uniform1f(timeLoc, t * 0.001);
    gl.uniform2f(resLoc, canvas.width, canvas.height);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    requestAnimationFrame(render);
}
render(0);
    </script>
</body>
</html>
