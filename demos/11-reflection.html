<!DOCTYPE html>
<html>
<head>
    <title>Reflection/Refraction</title>
    <style>
        body { margin: 0; background: #000; }
        canvas { display: block; }
        .info { position: absolute; top: 10px; left: 10px; color: #fff; font: 12px monospace; background: rgba(0,0,0,0.7); padding: 10px; }
    </style>
</head>
<body>
    <div class="info">
        <b>Reflection/Refraction</b><br>
        Simulated scene reflected and refracted<br>
        through distorted water surface.<br>
        Note chromatic aberration in refraction.
    </div>
    <canvas id="c"></canvas>
    <script>
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl');

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    gl.viewport(0, 0, canvas.width, canvas.height);
}
resize();
window.addEventListener('resize', resize);

const vs = `attribute vec2 pos; void main() { gl_Position = vec4(pos, 0, 1); }`;

const fs = `
precision highp float;
uniform float time;
uniform vec2 resolution;

vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
vec2 mod289(vec2 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
vec3 permute(vec3 x) { return mod289(((x*34.0)+1.0)*x); }

float snoise(vec2 v) {
    const vec4 C = vec4(0.211324865405187, 0.366025403784439, -0.577350269189626, 0.024390243902439);
    vec2 i = floor(v + dot(v, C.yy));
    vec2 x0 = v - i + dot(i, C.xx);
    vec2 i1 = (x0.x > x0.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
    vec4 x12 = x0.xyxy + C.xxzz;
    x12.xy -= i1;
    i = mod289(i);
    vec3 p = permute(permute(i.y + vec3(0.0, i1.y, 1.0)) + i.x + vec3(0.0, i1.x, 1.0));
    vec3 m = max(0.5 - vec3(dot(x0,x0), dot(x12.xy,x12.xy), dot(x12.zw,x12.zw)), 0.0);
    m = m*m; m = m*m;
    vec3 x = 2.0 * fract(p * C.www) - 1.0;
    vec3 h = abs(x) - 0.5;
    vec3 ox = floor(x + 0.5);
    vec3 a0 = x - ox;
    m *= 1.79284291400159 - 0.85373472095314 * (a0*a0 + h*h);
    vec3 g;
    g.x = a0.x * x0.x + h.x * x0.y;
    g.yz = a0.yz * x12.xz + h.yz * x12.yw;
    return 130.0 * dot(m, g);
}

// Procedural "scene" for reflection/refraction
vec3 scene(vec2 uv, bool underwater) {
    if (underwater) {
        // Underwater: sandy bottom with caustics
        vec3 sand = vec3(0.8, 0.7, 0.5) * 0.3;
        float caustic = pow(abs(snoise(uv * 10.0 + time)), 2.0);
        return sand + vec3(0.1, 0.2, 0.3) * caustic;
    } else {
        // Above water: sky with clouds and sun
        vec3 sky = mix(vec3(0.4, 0.6, 0.9), vec3(0.7, 0.8, 1.0), uv.y);

        // Clouds
        float cloud = snoise(uv * 3.0 + vec2(time * 0.05, 0.0));
        cloud = smoothstep(0.2, 0.5, cloud);
        sky = mix(sky, vec3(1.0), cloud * 0.5);

        // Sun
        vec2 sunPos = vec2(0.7, 0.8);
        float sun = 1.0 - smoothstep(0.0, 0.1, length(uv - sunPos));
        sky += vec3(1.0, 0.9, 0.7) * sun;

        return sky;
    }
}

void main() {
    vec2 uv = gl_FragCoord.xy / resolution;
    float aspect = resolution.x / resolution.y;

    float waterLine = 0.5;
    float t = time * 0.5;

    // Water distortion
    vec2 distort = vec2(
        snoise(uv * 5.0 + t) * 0.02,
        snoise(uv * 5.0 + t + 100.0) * 0.02
    );

    vec3 color;

    if (uv.y > waterLine) {
        // Above water - show sky
        color = scene(uv, false);
    } else {
        // Water surface
        float fresnel = pow(1.0 - (waterLine - uv.y) * 2.0, 3.0);
        fresnel = clamp(fresnel, 0.1, 0.9);

        // Reflection (flip Y, add distortion)
        vec2 reflectUV = vec2(uv.x, waterLine + (waterLine - uv.y)) + distort;
        vec3 reflection = scene(reflectUV, false);

        // Refraction with chromatic aberration
        vec2 refractUV = uv + distort * 2.0;
        vec3 refraction;
        refraction.r = scene(refractUV + distort * 0.5, true).r;
        refraction.g = scene(refractUV, true).g;
        refraction.b = scene(refractUV - distort * 0.5, true).b;

        // Tint refraction
        refraction *= vec3(0.6, 0.8, 0.9);

        // Blend based on fresnel
        color = mix(refraction, reflection, fresnel);

        // Depth fog
        float depth = (waterLine - uv.y) / waterLine;
        color = mix(color, vec3(0.0, 0.2, 0.4), depth * 0.5);
    }

    // Surface highlight at waterline
    float surfaceDist = abs(uv.y - waterLine);
    if (surfaceDist < 0.005) {
        color = mix(color, vec3(0.9, 0.95, 1.0), 1.0 - surfaceDist / 0.005);
    }

    gl_FragColor = vec4(color, 1.0);
}
`;

function createShader(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    return s;
}

const prog = gl.createProgram();
gl.attachShader(prog, createShader(gl.VERTEX_SHADER, vs));
gl.attachShader(prog, createShader(gl.FRAGMENT_SHADER, fs));
gl.linkProgram(prog);
gl.useProgram(prog);

const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,1,-1,-1,1,1,1]), gl.STATIC_DRAW);

const pos = gl.getAttribLocation(prog, 'pos');
gl.enableVertexAttribArray(pos);
gl.vertexAttribPointer(pos, 2, gl.FLOAT, false, 0, 0);

const timeLoc = gl.getUniformLocation(prog, 'time');
const resLoc = gl.getUniformLocation(prog, 'resolution');

function render(t) {
    gl.uniform1f(timeLoc, t * 0.001);
    gl.uniform2f(resLoc, canvas.width, canvas.height);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    requestAnimationFrame(render);
}
render(0);
    </script>
</body>
</html>
