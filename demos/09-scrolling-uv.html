<!DOCTYPE html>
<html>
<head>
    <title>Scrolling UV</title>
    <style>
        body { margin: 0; background: #000; }
        canvas { display: block; }
        .info { position: absolute; top: 10px; left: 10px; color: #fff; font: 12px monospace; background: rgba(0,0,0,0.7); padding: 10px; }
    </style>
</head>
<body>
    <div class="info">
        <b>Scrolling UV</b><br>
        Multiple texture layers scrolling<br>
        at different speeds/directions.<br>
        Simple but effective for stylized water.
    </div>
    <canvas id="c"></canvas>
    <script>
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl');

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    gl.viewport(0, 0, canvas.width, canvas.height);
}
resize();
window.addEventListener('resize', resize);

const vs = `attribute vec2 pos; void main() { gl_Position = vec4(pos, 0, 1); }`;

const fs = `
precision highp float;
uniform float time;
uniform vec2 resolution;

// Simple hash for pseudo-random
float hash(vec2 p) {
    return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
}

// Value noise
float noise(vec2 p) {
    vec2 i = floor(p);
    vec2 f = fract(p);
    f = f * f * (3.0 - 2.0 * f);

    float a = hash(i);
    float b = hash(i + vec2(1.0, 0.0));
    float c = hash(i + vec2(0.0, 1.0));
    float d = hash(i + vec2(1.0, 1.0));

    return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
}

// Water pattern
float waterPattern(vec2 uv) {
    float n = 0.0;
    n += noise(uv * 4.0) * 0.5;
    n += noise(uv * 8.0) * 0.25;
    n += noise(uv * 16.0) * 0.125;

    // Add wave-like distortion
    n += sin(uv.x * 20.0 + n * 5.0) * 0.1;
    n += sin(uv.y * 15.0 + n * 3.0) * 0.1;

    return n;
}

void main() {
    vec2 uv = gl_FragCoord.xy / resolution;
    float t = time;

    // Multiple scrolling layers
    vec2 uv1 = uv + vec2(t * 0.1, t * 0.05);
    vec2 uv2 = uv + vec2(-t * 0.08, t * 0.12);
    vec2 uv3 = uv + vec2(t * 0.05, -t * 0.03);

    float layer1 = waterPattern(uv1 * 2.0);
    float layer2 = waterPattern(uv2 * 3.0);
    float layer3 = waterPattern(uv3 * 1.5);

    // Combine layers
    float water = layer1 * 0.5 + layer2 * 0.3 + layer3 * 0.2;

    // Color ramp
    vec3 deep = vec3(0.02, 0.1, 0.2);
    vec3 mid = vec3(0.0, 0.3, 0.5);
    vec3 shallow = vec3(0.2, 0.5, 0.7);

    vec3 color;
    if (water < 0.4) {
        color = mix(deep, mid, water / 0.4);
    } else {
        color = mix(mid, shallow, (water - 0.4) / 0.6);
    }

    // Add sparkle highlights
    float sparkle = pow(noise(uv * 50.0 + t * 5.0), 10.0);
    color += vec3(1.0) * sparkle * 0.3;

    // Foam lines
    float foam = smoothstep(0.65, 0.7, water);
    color = mix(color, vec3(0.9, 0.95, 1.0), foam * 0.5);

    gl_FragColor = vec4(color, 1.0);
}
`;

function createShader(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    return s;
}

const prog = gl.createProgram();
gl.attachShader(prog, createShader(gl.VERTEX_SHADER, vs));
gl.attachShader(prog, createShader(gl.FRAGMENT_SHADER, fs));
gl.linkProgram(prog);
gl.useProgram(prog);

const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,1,-1,-1,1,1,1]), gl.STATIC_DRAW);

const pos = gl.getAttribLocation(prog, 'pos');
gl.enableVertexAttribArray(pos);
gl.vertexAttribPointer(pos, 2, gl.FLOAT, false, 0, 0);

const timeLoc = gl.getUniformLocation(prog, 'time');
const resLoc = gl.getUniformLocation(prog, 'resolution');

function render(t) {
    gl.uniform1f(timeLoc, t * 0.001);
    gl.uniform2f(resLoc, canvas.width, canvas.height);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    requestAnimationFrame(render);
}
render(0);
    </script>
</body>
</html>
