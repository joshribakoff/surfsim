<!DOCTYPE html>
<html>
<head>
    <title>Voronoi Water Cells</title>
    <style>
        body { margin: 0; background: #000; }
        canvas { display: block; }
        .info { position: absolute; top: 10px; left: 10px; color: #fff; font: 12px monospace; background: rgba(0,0,0,0.7); padding: 10px; }
    </style>
</head>
<body>
    <div class="info">
        <b>Voronoi Water Cells</b><br>
        Voronoi diagram creates cellular<br>
        patterns similar to caustics.<br>
        Cell edges catch light.
    </div>
    <canvas id="c"></canvas>
    <script>
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl');

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    gl.viewport(0, 0, canvas.width, canvas.height);
}
resize();
window.addEventListener('resize', resize);

const vs = `attribute vec2 pos; void main() { gl_Position = vec4(pos, 0, 1); }`;

const fs = `
precision highp float;
uniform float time;
uniform vec2 resolution;

// Hash functions
vec2 hash2(vec2 p) {
    return fract(sin(vec2(dot(p, vec2(127.1, 311.7)), dot(p, vec2(269.5, 183.3)))) * 43758.5453);
}

// Voronoi with cell distance
vec3 voronoi(vec2 p, float t) {
    vec2 n = floor(p);
    vec2 f = fract(p);

    float minDist = 8.0;
    float secondDist = 8.0;
    vec2 minPoint;

    for (int j = -1; j <= 1; j++) {
        for (int i = -1; i <= 1; i++) {
            vec2 g = vec2(float(i), float(j));
            vec2 o = hash2(n + g);

            // Animate points
            o = 0.5 + 0.5 * sin(t + 6.2831 * o);

            vec2 r = g + o - f;
            float d = dot(r, r);

            if (d < minDist) {
                secondDist = minDist;
                minDist = d;
                minPoint = o;
            } else if (d < secondDist) {
                secondDist = d;
            }
        }
    }

    float edge = secondDist - minDist;
    return vec3(sqrt(minDist), sqrt(secondDist), edge);
}

void main() {
    vec2 uv = gl_FragCoord.xy / resolution;
    float aspect = resolution.x / resolution.y;
    vec2 p = uv * vec2(aspect, 1.0) * 8.0;

    float t = time * 0.5;

    // Layer voronoi at different scales
    vec3 v1 = voronoi(p, t);
    vec3 v2 = voronoi(p * 2.0, t * 0.7);
    vec3 v3 = voronoi(p * 0.5, t * 1.3);

    // Edge detection creates caustic-like lines
    float edges = smoothstep(0.0, 0.1, v1.z) * 0.5 +
                  smoothstep(0.0, 0.05, v2.z) * 0.3 +
                  smoothstep(0.0, 0.15, v3.z) * 0.2;

    // Cell variation
    float cellVar = v1.x * 0.5 + v2.x * 0.3 + v3.x * 0.2;

    // Base water color
    vec3 deepColor = vec3(0.0, 0.1, 0.25);
    vec3 midColor = vec3(0.0, 0.25, 0.45);
    vec3 lightColor = vec3(0.1, 0.5, 0.7);

    vec3 color = mix(deepColor, midColor, cellVar);

    // Bright edges (caustics)
    color = mix(color, lightColor, edges);

    // Add sparkles at cell centers
    float sparkle = pow(1.0 - v1.x, 8.0);
    color += vec3(0.5, 0.6, 0.7) * sparkle;

    // Animate brightness
    float pulse = sin(t * 2.0 + v1.x * 10.0) * 0.5 + 0.5;
    color += vec3(0.05, 0.1, 0.15) * pulse * (1.0 - edges);

    gl_FragColor = vec4(color, 1.0);
}
`;

function createShader(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    return s;
}

const prog = gl.createProgram();
gl.attachShader(prog, createShader(gl.VERTEX_SHADER, vs));
gl.attachShader(prog, createShader(gl.FRAGMENT_SHADER, fs));
gl.linkProgram(prog);
gl.useProgram(prog);

const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,1,-1,-1,1,1,1]), gl.STATIC_DRAW);

const pos = gl.getAttribLocation(prog, 'pos');
gl.enableVertexAttribArray(pos);
gl.vertexAttribPointer(pos, 2, gl.FLOAT, false, 0, 0);

const timeLoc = gl.getUniformLocation(prog, 'time');
const resLoc = gl.getUniformLocation(prog, 'resolution');

function render(t) {
    gl.uniform1f(timeLoc, t * 0.001);
    gl.uniform2f(resLoc, canvas.width, canvas.height);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    requestAnimationFrame(render);
}
render(0);
    </script>
</body>
</html>
