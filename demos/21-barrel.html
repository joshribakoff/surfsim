<!DOCTYPE html>
<html>
<head>
    <title>Barrel Effect</title>
    <style>
        body { margin: 0; background: #000; }
        canvas { display: block; }
        .info { position: absolute; top: 10px; left: 10px; color: #fff; font: 12px monospace; background: rgba(0,0,0,0.7); padding: 10px; }
    </style>
</head>
<body>
    <div class="info">
        <b>Barrel/Tube Effect</b><br>
        View from inside a barreling wave.<br>
        The "green room" - holy grail of surfing!
    </div>
    <canvas id="c"></canvas>
    <script>
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl');

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    gl.viewport(0, 0, canvas.width, canvas.height);
}
resize();
window.addEventListener('resize', resize);

const vs = `attribute vec2 pos; void main() { gl_Position = vec4(pos, 0, 1); }`;

const fs = `
precision highp float;
uniform float time;
uniform vec2 resolution;

#define PI 3.14159265

vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
vec2 mod289(vec2 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
vec3 permute(vec3 x) { return mod289(((x*34.0)+1.0)*x); }

float snoise(vec2 v) {
    const vec4 C = vec4(0.211324865405187, 0.366025403784439, -0.577350269189626, 0.024390243902439);
    vec2 i = floor(v + dot(v, C.yy));
    vec2 x0 = v - i + dot(i, C.xx);
    vec2 i1 = (x0.x > x0.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
    vec4 x12 = x0.xyxy + C.xxzz;
    x12.xy -= i1;
    i = mod289(i);
    vec3 p = permute(permute(i.y + vec3(0.0, i1.y, 1.0)) + i.x + vec3(0.0, i1.x, 1.0));
    vec3 m = max(0.5 - vec3(dot(x0,x0), dot(x12.xy,x12.xy), dot(x12.zw,x12.zw)), 0.0);
    m = m*m; m = m*m;
    vec3 x = 2.0 * fract(p * C.www) - 1.0;
    vec3 h = abs(x) - 0.5;
    vec3 ox = floor(x + 0.5);
    vec3 a0 = x - ox;
    m *= 1.79284291400159 - 0.85373472095314 * (a0*a0 + h*h);
    vec3 g;
    g.x = a0.x * x0.x + h.x * x0.y;
    g.yz = a0.yz * x12.xz + h.yz * x12.yw;
    return 130.0 * dot(m, g);
}

// Barrel tube shape - viewed from inside
float barrelShape(vec2 p, float z) {
    // Radius varies along tube (z)
    float radius = 0.3 + z * 0.15;

    // Tube is not perfectly circular - more elliptical
    p.y *= 1.2;

    // Distance from center
    float dist = length(p);

    // Add some organic variation
    float angle = atan(p.y, p.x);
    radius += sin(angle * 3.0 + z * 2.0) * 0.03;
    radius += snoise(vec2(angle * 2.0, z * 3.0)) * 0.02;

    return dist - radius;
}

void main() {
    vec2 uv = gl_FragCoord.xy / resolution;
    float aspect = resolution.x / resolution.y;

    // Center and scale
    vec2 p = (uv - 0.5) * vec2(aspect, 1.0);

    // Shift center slightly down (surfer's POV)
    p.y += 0.1;

    float t = time * 0.5;

    vec3 color = vec3(0.0);

    // Raymarching through the tube
    float depth = 0.0;
    bool hitWater = false;
    vec3 hitPos;

    for (int i = 0; i < 30; i++) {
        float z = float(i) * 0.1;
        float d = barrelShape(p * (1.0 + z * 0.5), z);

        if (d < 0.0) {
            hitWater = true;
            depth = z;
            hitPos = vec3(p * (1.0 + z * 0.5), z);
            break;
        }
    }

    if (hitWater) {
        // Water color with depth
        vec3 deepColor = vec3(0.0, 0.1, 0.2);
        vec3 shallowColor = vec3(0.1, 0.4, 0.5);
        vec3 glowColor = vec3(0.2, 0.6, 0.4);

        float depthFactor = depth / 3.0;
        color = mix(shallowColor, deepColor, depthFactor);

        // Light coming through water (green room glow)
        float glow = exp(-depth * 0.5);
        color = mix(color, glowColor, glow * 0.5);

        // Surface texture
        float texture = snoise(hitPos.xy * 20.0 + t);
        texture += snoise(hitPos.xy * 40.0 - t * 0.5) * 0.5;
        color += vec3(0.05, 0.1, 0.08) * texture;

        // Flow lines on barrel surface
        float angle = atan(hitPos.y, hitPos.x);
        float flow = sin(angle * 30.0 + hitPos.z * 10.0 - t * 5.0);
        flow = smoothstep(0.7, 1.0, flow);
        color += vec3(0.1, 0.15, 0.12) * flow * glow;

        // Foam streaks
        float foam = snoise(vec2(angle * 5.0, hitPos.z * 2.0 + t));
        foam = smoothstep(0.6, 0.8, foam);
        color = mix(color, vec3(0.8, 0.9, 0.95), foam * 0.3 * glow);

    } else {
        // Looking out the end of barrel - bright exit
        float dist = length(p);

        // Exit light
        vec3 exitLight = vec3(0.8, 0.9, 1.0);
        vec3 skyBlue = vec3(0.4, 0.6, 0.9);

        float exitGlow = exp(-dist * 3.0);
        color = mix(skyBlue, exitLight, exitGlow);

        // Sun/bright spot
        vec2 sunPos = vec2(0.1, 0.1);
        float sun = exp(-length(p - sunPos) * 5.0);
        color += vec3(1.0, 0.95, 0.8) * sun;
    }

    // Vignette (barrel edges)
    float vignette = 1.0 - length(uv - 0.5) * 1.2;
    vignette = clamp(vignette, 0.0, 1.0);
    color *= vignette;

    // Spray particles
    for (int i = 0; i < 5; i++) {
        float fi = float(i);
        vec2 sprayPos = vec2(
            snoise(vec2(fi * 10.0, t)),
            snoise(vec2(fi * 10.0 + 100.0, t))
        ) * 0.3;

        float spray = smoothstep(0.02, 0.0, length(p - sprayPos));
        color += vec3(0.5, 0.6, 0.7) * spray;
    }

    gl_FragColor = vec4(color, 1.0);
}
`;

function createShader(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    return s;
}

const prog = gl.createProgram();
gl.attachShader(prog, createShader(gl.VERTEX_SHADER, vs));
gl.attachShader(prog, createShader(gl.FRAGMENT_SHADER, fs));
gl.linkProgram(prog);
gl.useProgram(prog);

const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,1,-1,-1,1,1,1]), gl.STATIC_DRAW);

const pos = gl.getAttribLocation(prog, 'pos');
gl.enableVertexAttribArray(pos);
gl.vertexAttribPointer(pos, 2, gl.FLOAT, false, 0, 0);

const timeLoc = gl.getUniformLocation(prog, 'time');
const resLoc = gl.getUniformLocation(prog, 'resolution');

function render(t) {
    gl.uniform1f(timeLoc, t * 0.001);
    gl.uniform2f(resLoc, canvas.width, canvas.height);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    requestAnimationFrame(render);
}
render(0);
    </script>
</body>
</html>
