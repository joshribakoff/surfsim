<!DOCTYPE html>
<html>
<head>
    <title>Fresnel Effect</title>
    <style>
        body { margin: 0; background: #000; }
        canvas { display: block; }
        .info { position: absolute; top: 10px; left: 10px; color: #fff; font: 12px monospace; background: rgba(0,0,0,0.7); padding: 10px; }
    </style>
</head>
<body>
    <div class="info">
        <b>Fresnel Effect</b><br>
        More reflection at glancing angles,<br>
        more refraction when looking straight down.<br>
        Key for realistic water appearance.
    </div>
    <canvas id="c"></canvas>
    <script>
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl');

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    gl.viewport(0, 0, canvas.width, canvas.height);
}
resize();
window.addEventListener('resize', resize);

const vs = `attribute vec2 pos; void main() { gl_Position = vec4(pos, 0, 1); }`;

const fs = `
precision highp float;
uniform float time;
uniform vec2 resolution;

vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
vec2 mod289(vec2 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
vec3 permute(vec3 x) { return mod289(((x*34.0)+1.0)*x); }

float snoise(vec2 v) {
    const vec4 C = vec4(0.211324865405187, 0.366025403784439, -0.577350269189626, 0.024390243902439);
    vec2 i = floor(v + dot(v, C.yy));
    vec2 x0 = v - i + dot(i, C.xx);
    vec2 i1 = (x0.x > x0.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
    vec4 x12 = x0.xyxy + C.xxzz;
    x12.xy -= i1;
    i = mod289(i);
    vec3 p = permute(permute(i.y + vec3(0.0, i1.y, 1.0)) + i.x + vec3(0.0, i1.x, 1.0));
    vec3 m = max(0.5 - vec3(dot(x0,x0), dot(x12.xy,x12.xy), dot(x12.zw,x12.zw)), 0.0);
    m = m*m; m = m*m;
    vec3 x = 2.0 * fract(p * C.www) - 1.0;
    vec3 h = abs(x) - 0.5;
    vec3 ox = floor(x + 0.5);
    vec3 a0 = x - ox;
    m *= 1.79284291400159 - 0.85373472095314 * (a0*a0 + h*h);
    vec3 g;
    g.x = a0.x * x0.x + h.x * x0.y;
    g.yz = a0.yz * x12.xz + h.yz * x12.yw;
    return 130.0 * dot(m, g);
}

vec3 getNormal(vec2 uv, float t) {
    float eps = 0.002;
    float h = snoise(uv * 4.0 + t);
    float hx = snoise((uv + vec2(eps, 0.0)) * 4.0 + t);
    float hy = snoise((uv + vec2(0.0, eps)) * 4.0 + t);
    return normalize(vec3(-(hx - h) / eps * 0.2, -(hy - h) / eps * 0.2, 1.0));
}

// Schlick's Fresnel approximation
float fresnel(vec3 viewDir, vec3 normal, float F0) {
    float cosTheta = max(dot(viewDir, normal), 0.0);
    return F0 + (1.0 - F0) * pow(1.0 - cosTheta, 5.0);
}

void main() {
    vec2 uv = gl_FragCoord.xy / resolution;
    float t = time * 0.3;

    // Simulate 3D view - camera looking at water plane
    // UV maps to xz position on water plane
    vec3 waterPos = vec3((uv.x - 0.5) * 4.0, 0.0, (uv.y - 0.5) * 4.0 + 2.0);
    vec3 cameraPos = vec3(0.0, 1.5, 0.0);
    vec3 viewDir = normalize(cameraPos - waterPos);

    vec3 normal = getNormal(uv, t);

    // Fresnel factor (water has F0 ~0.02)
    float F = fresnel(viewDir, normal, 0.02);

    // Sky reflection (simplified gradient)
    vec3 reflectDir = reflect(-viewDir, normal);
    float skyGradient = reflectDir.y * 0.5 + 0.5;
    vec3 skyColor = mix(vec3(0.6, 0.7, 0.9), vec3(0.3, 0.5, 0.8), skyGradient);

    // Water refraction color (what's below)
    vec3 waterColor = vec3(0.0, 0.2, 0.3);
    float depth = 1.0 - uv.y; // fake depth
    waterColor = mix(vec3(0.0, 0.4, 0.5), vec3(0.0, 0.1, 0.2), depth);

    // Blend based on Fresnel
    vec3 color = mix(waterColor, skyColor, F);

    // Add sun specular
    vec3 sunDir = normalize(vec3(0.3, 0.8, 0.5));
    vec3 halfVec = normalize(sunDir + viewDir);
    float spec = pow(max(dot(normal, halfVec), 0.0), 256.0);
    color += vec3(1.0, 0.95, 0.9) * spec;

    // Show fresnel factor as overlay on edge
    if (uv.x < 0.02) {
        color = vec3(F);
    }

    gl_FragColor = vec4(color, 1.0);
}
`;

function createShader(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    return s;
}

const prog = gl.createProgram();
gl.attachShader(prog, createShader(gl.VERTEX_SHADER, vs));
gl.attachShader(prog, createShader(gl.FRAGMENT_SHADER, fs));
gl.linkProgram(prog);
gl.useProgram(prog);

const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,1,-1,-1,1,1,1]), gl.STATIC_DRAW);

const pos = gl.getAttribLocation(prog, 'pos');
gl.enableVertexAttribArray(pos);
gl.vertexAttribPointer(pos, 2, gl.FLOAT, false, 0, 0);

const timeLoc = gl.getUniformLocation(prog, 'time');
const resLoc = gl.getUniformLocation(prog, 'resolution');

function render(t) {
    gl.uniform1f(timeLoc, t * 0.001);
    gl.uniform2f(resLoc, canvas.width, canvas.height);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    requestAnimationFrame(render);
}
render(0);
    </script>
</body>
</html>
