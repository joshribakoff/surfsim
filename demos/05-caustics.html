<!DOCTYPE html>
<html>
<head>
    <title>Caustics</title>
    <style>
        body { margin: 0; background: #000; }
        canvas { display: block; }
        .info { position: absolute; top: 10px; left: 10px; color: #fff; font: 12px monospace; background: rgba(0,0,0,0.7); padding: 10px; }
    </style>
</head>
<body>
    <div class="info">
        <b>Caustics</b><br>
        Light refraction patterns on the sea floor.<br>
        Created by overlapping wave patterns<br>
        focusing and defocusing light.
    </div>
    <canvas id="c"></canvas>
    <script>
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl');

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    gl.viewport(0, 0, canvas.width, canvas.height);
}
resize();
window.addEventListener('resize', resize);

const vs = `attribute vec2 pos; void main() { gl_Position = vec4(pos, 0, 1); }`;

const fs = `
precision highp float;
uniform float time;
uniform vec2 resolution;

// Attempt to recreate caustic patterns
float caustic(vec2 p, float t) {
    float c = 0.0;

    // Multiple overlapping wave patterns
    for (int i = 0; i < 3; i++) {
        float fi = float(i);
        float scale = 1.0 + fi * 0.5;
        float speed = 1.0 + fi * 0.3;
        float angle = fi * 2.094; // 120 degrees apart

        vec2 dir = vec2(cos(angle), sin(angle));
        float wave = sin(dot(p * scale, dir) * 10.0 + t * speed);

        // Sharp peaks create caustic-like patterns
        wave = abs(wave);
        wave = pow(wave, 0.5);
        c += wave;
    }

    // Add finer detail
    c += sin(p.x * 30.0 + t * 2.0) * sin(p.y * 30.0 + t * 1.7) * 0.3;

    return c / 3.5;
}

void main() {
    vec2 uv = gl_FragCoord.xy / resolution;
    vec2 p = uv * 2.0 - 1.0;
    p.x *= resolution.x / resolution.y;

    float t = time;

    // Layer caustics at different scales
    float c = caustic(p, t);
    c += caustic(p * 1.5, t * 0.8) * 0.5;
    c += caustic(p * 2.5, t * 1.2) * 0.25;

    c = pow(c, 1.5);

    // Ocean floor color
    vec3 floorColor = vec3(0.1, 0.2, 0.3);
    vec3 lightColor = vec3(0.3, 0.7, 0.9);

    vec3 color = floorColor + lightColor * c * 0.6;

    // Add some sand texture
    float sand = fract(sin(dot(uv * 500.0, vec2(12.9898, 78.233))) * 43758.5453);
    color += vec3(0.02) * sand;

    gl_FragColor = vec4(color, 1.0);
}
`;

function createShader(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    return s;
}

const prog = gl.createProgram();
gl.attachShader(prog, createShader(gl.VERTEX_SHADER, vs));
gl.attachShader(prog, createShader(gl.FRAGMENT_SHADER, fs));
gl.linkProgram(prog);
gl.useProgram(prog);

const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,1,-1,-1,1,1,1]), gl.STATIC_DRAW);

const pos = gl.getAttribLocation(prog, 'pos');
gl.enableVertexAttribArray(pos);
gl.vertexAttribPointer(pos, 2, gl.FLOAT, false, 0, 0);

const timeLoc = gl.getUniformLocation(prog, 'time');
const resLoc = gl.getUniformLocation(prog, 'resolution');

function render(t) {
    gl.uniform1f(timeLoc, t * 0.001);
    gl.uniform2f(resLoc, canvas.width, canvas.height);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    requestAnimationFrame(render);
}
render(0);
    </script>
</body>
</html>
