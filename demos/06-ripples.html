<!DOCTYPE html>
<html>
<head>
    <title>Ripple Interference</title>
    <style>
        body { margin: 0; background: #000; }
        canvas { display: block; }
        .info { position: absolute; top: 10px; left: 10px; color: #fff; font: 12px monospace; background: rgba(0,0,0,0.7); padding: 10px; }
    </style>
</head>
<body>
    <div class="info">
        <b>Ripple Interference</b><br>
        Circular ripples from multiple points<br>
        creating interference patterns.<br>
        Click to add ripple sources!
    </div>
    <canvas id="c"></canvas>
    <script>
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl');

let ripples = [
    { x: 0.3, y: 0.5, birth: 0 },
    { x: 0.7, y: 0.5, birth: 0.5 },
    { x: 0.5, y: 0.3, birth: 1.0 }
];

canvas.addEventListener('click', (e) => {
    const rect = canvas.getBoundingClientRect();
    ripples.push({
        x: e.clientX / rect.width,
        y: 1.0 - e.clientY / rect.height,
        birth: performance.now() * 0.001
    });
    if (ripples.length > 10) ripples.shift();
});

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    gl.viewport(0, 0, canvas.width, canvas.height);
}
resize();
window.addEventListener('resize', resize);

const vs = `attribute vec2 pos; void main() { gl_Position = vec4(pos, 0, 1); }`;

const fs = `
precision highp float;
uniform float time;
uniform vec2 resolution;
uniform vec3 ripples[10];
uniform int rippleCount;

void main() {
    vec2 uv = gl_FragCoord.xy / resolution;
    float aspect = resolution.x / resolution.y;

    float wave = 0.0;

    for (int i = 0; i < 10; i++) {
        if (i >= rippleCount) break;

        vec2 center = ripples[i].xy;
        float birth = ripples[i].z;
        float age = time - birth;

        if (age < 0.0) continue;

        vec2 d = uv - center;
        d.x *= aspect;
        float dist = length(d);

        float radius = age * 0.3;
        float ringDist = abs(dist - radius);

        float amplitude = exp(-age * 0.5) * exp(-ringDist * 20.0);
        wave += sin(dist * 50.0 - age * 10.0) * amplitude;
    }

    // Water color
    vec3 baseColor = vec3(0.0, 0.2, 0.4);
    vec3 highlightColor = vec3(0.2, 0.6, 0.8);

    float brightness = wave * 0.5 + 0.5;
    vec3 color = mix(baseColor, highlightColor, brightness);

    // Add specular highlights
    float spec = pow(max(wave, 0.0), 3.0);
    color += vec3(0.8, 0.9, 1.0) * spec;

    gl_FragColor = vec4(color, 1.0);
}
`;

function createShader(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
        console.error(gl.getShaderInfoLog(s));
    }
    return s;
}

const prog = gl.createProgram();
gl.attachShader(prog, createShader(gl.VERTEX_SHADER, vs));
gl.attachShader(prog, createShader(gl.FRAGMENT_SHADER, fs));
gl.linkProgram(prog);
gl.useProgram(prog);

const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,1,-1,-1,1,1,1]), gl.STATIC_DRAW);

const pos = gl.getAttribLocation(prog, 'pos');
gl.enableVertexAttribArray(pos);
gl.vertexAttribPointer(pos, 2, gl.FLOAT, false, 0, 0);

const timeLoc = gl.getUniformLocation(prog, 'time');
const resLoc = gl.getUniformLocation(prog, 'resolution');
const rippleLocs = [];
for (let i = 0; i < 10; i++) {
    rippleLocs.push(gl.getUniformLocation(prog, `ripples[${i}]`));
}
const countLoc = gl.getUniformLocation(prog, 'rippleCount');

function render(t) {
    const time = t * 0.001;
    gl.uniform1f(timeLoc, time);
    gl.uniform2f(resLoc, canvas.width, canvas.height);
    gl.uniform1i(countLoc, ripples.length);

    for (let i = 0; i < ripples.length && i < 10; i++) {
        gl.uniform3f(rippleLocs[i], ripples[i].x, ripples[i].y, ripples[i].birth);
    }

    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    requestAnimationFrame(render);
}
render(0);
    </script>
</body>
</html>
