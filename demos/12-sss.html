<!DOCTYPE html>
<html>
<head>
    <title>Subsurface Scattering</title>
    <style>
        body { margin: 0; background: #000; }
        canvas { display: block; }
        .info { position: absolute; top: 10px; left: 10px; color: #fff; font: 12px monospace; background: rgba(0,0,0,0.7); padding: 10px; }
    </style>
</head>
<body>
    <div class="info">
        <b>Subsurface Scattering</b><br>
        Light penetrating thin water volumes<br>
        scatters and creates glowing edges.<br>
        Important for wave crests and foam.
    </div>
    <canvas id="c"></canvas>
    <script>
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl');

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    gl.viewport(0, 0, canvas.width, canvas.height);
}
resize();
window.addEventListener('resize', resize);

const vs = `attribute vec2 pos; void main() { gl_Position = vec4(pos, 0, 1); }`;

const fs = `
precision highp float;
uniform float time;
uniform vec2 resolution;

vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
vec2 mod289(vec2 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
vec3 permute(vec3 x) { return mod289(((x*34.0)+1.0)*x); }

float snoise(vec2 v) {
    const vec4 C = vec4(0.211324865405187, 0.366025403784439, -0.577350269189626, 0.024390243902439);
    vec2 i = floor(v + dot(v, C.yy));
    vec2 x0 = v - i + dot(i, C.xx);
    vec2 i1 = (x0.x > x0.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
    vec4 x12 = x0.xyxy + C.xxzz;
    x12.xy -= i1;
    i = mod289(i);
    vec3 p = permute(permute(i.y + vec3(0.0, i1.y, 1.0)) + i.x + vec3(0.0, i1.x, 1.0));
    vec3 m = max(0.5 - vec3(dot(x0,x0), dot(x12.xy,x12.xy), dot(x12.zw,x12.zw)), 0.0);
    m = m*m; m = m*m;
    vec3 x = 2.0 * fract(p * C.www) - 1.0;
    vec3 h = abs(x) - 0.5;
    vec3 ox = floor(x + 0.5);
    vec3 a0 = x - ox;
    m *= 1.79284291400159 - 0.85373472095314 * (a0*a0 + h*h);
    vec3 g;
    g.x = a0.x * x0.x + h.x * x0.y;
    g.yz = a0.yz * x12.xz + h.yz * x12.yw;
    return 130.0 * dot(m, g);
}

// Wave function with thickness info
float wave(vec2 p, float t) {
    float w = 0.0;
    w += sin(p.x * 3.0 + t * 2.0) * 0.3;
    w += sin(p.x * 7.0 - t * 1.5) * 0.15;
    w += snoise(p * 2.0 + t * 0.5) * 0.1;
    return w;
}

void main() {
    vec2 uv = gl_FragCoord.xy / resolution;
    float t = time;

    vec2 p = uv * 4.0 - 2.0;

    float w = wave(p, t);
    float surface = uv.y - 0.5 - w * 0.2;

    // Light direction (from behind/above)
    vec3 lightDir = normalize(vec3(-0.3, 0.5, 0.8));

    vec3 color;

    if (surface < 0.0) {
        float depth = -surface;

        // Base water color
        vec3 deepColor = vec3(0.0, 0.05, 0.15);
        vec3 shallowColor = vec3(0.0, 0.3, 0.5);
        color = mix(shallowColor, deepColor, clamp(depth * 5.0, 0.0, 1.0));

        // Calculate "thickness" - thinner at wave crests
        float thickness = depth * 3.0;

        // SSS effect - light passes through thin areas
        float sss = exp(-thickness * 2.0);

        // SSS color - warm/green tint as light passes through
        vec3 sssColor = vec3(0.1, 0.5, 0.4);

        // View-dependent SSS (stronger when looking toward light)
        float viewSSS = pow(max(dot(normalize(vec3(0.0, 1.0, 0.5)), lightDir), 0.0), 2.0);

        color += sssColor * sss * (0.5 + viewSSS * 0.5);

        // Extra glow at wave peaks
        float crestDist = abs(surface);
        if (crestDist < 0.05) {
            float crestGlow = 1.0 - crestDist / 0.05;
            color += vec3(0.2, 0.6, 0.5) * crestGlow * 0.5;
        }

        // Fake normal for additional lighting
        float eps = 0.01;
        float wx = wave(p + vec2(eps, 0.0), t);
        float slope = (wx - w) / eps;
        vec3 normal = normalize(vec3(-slope * 0.2, 1.0, 0.0));

        float diff = max(dot(normal, lightDir), 0.0);
        color += vec3(0.1, 0.15, 0.2) * diff;

    } else {
        // Sky
        color = mix(vec3(0.6, 0.75, 0.9), vec3(0.4, 0.6, 0.85), uv.y);
    }

    gl_FragColor = vec4(color, 1.0);
}
`;

function createShader(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    return s;
}

const prog = gl.createProgram();
gl.attachShader(prog, createShader(gl.VERTEX_SHADER, vs));
gl.attachShader(prog, createShader(gl.FRAGMENT_SHADER, fs));
gl.linkProgram(prog);
gl.useProgram(prog);

const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,1,-1,-1,1,1,1]), gl.STATIC_DRAW);

const pos = gl.getAttribLocation(prog, 'pos');
gl.enableVertexAttribArray(pos);
gl.vertexAttribPointer(pos, 2, gl.FLOAT, false, 0, 0);

const timeLoc = gl.getUniformLocation(prog, 'time');
const resLoc = gl.getUniformLocation(prog, 'resolution');

function render(t) {
    gl.uniform1f(timeLoc, t * 0.001);
    gl.uniform2f(resLoc, canvas.width, canvas.height);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    requestAnimationFrame(render);
}
render(0);
    </script>
</body>
</html>
